spring:
  application:
    name: product-service
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 30m
      cache-null-values: false

server:
  port: 8081

logging:
  level:
    com.example.productservice: DEBUG
    org.springframework.cache: DEBUG
